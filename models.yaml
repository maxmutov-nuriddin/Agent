# Narxlar: USD / 1M token. "cache_read" = keshdan o'qilgan kirish tokeni narxi.
# DIQQAT: narxlar xavfsizlik uchun yuqoriroq/konservativ olingan. Rasmiy sahifadan tekshiring:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    https://developers.openai.com/api/docs/pricing
#   Gemini:    https://ai.google.dev/gemini-api/docs/pricing
# `python -m aicompany check` kalitlar bilan model ID'larni haqiqiy ro'yxat bilan solishtiradi.
# Tier: cheap = oddiy ishlar, mid = asosiy ish, strong = murakkab/qayta urinish.
providers:
  anthropic:
    models:
      cheap:  {id: claude-haiku-5-5,  in: 0.10, out: 0.50,  cache_read: 0.01, effort: low}
      mid:    {id: claude-sonnet-5-5, in: 2.00, out: 10.00, cache_read: 0.20, effort: low}
      strong: {id: claude-opus-5-5,   in: 4.00, out: 20.00, cache_read: 0.20, effort: medium}
  openai:   # VERIFY: model nomlari manbalarda bir-biriga zid, `check` bilan tekshiring
    models:
      cheap:  {id: gpt-5.6-luna,  in: 0.20, out: 1.20,  cache_read: 0.02}
      mid:    {id: gpt-5.6-terra, in: 2.00, out: 12.00, cache_read: 0.20}
      strong: {id: gpt-5.6-sol,   in: 5.00, out: 30.00, cache_read: 0.50}
  gemini:   # model nomlari `python -m aicompany check` bilan tasdiqlangan (2026-10-08); narxlar taxminiy
    models:
      cheap:  {id: gemini-3.1-flash-lite, in: 0.25, out: 1.50, cache_read: 0.025}
      mid:    {id: gemini-3-flash-preview, in: 0.50, out: 3.00, cache_read: 0.05}
      strong: {id: gemini-3.5-flash,      in: 1.50, out: 9.00, cache_read: 0.15}
  openrouter:   # BEPUL modellar (:free). Faqat oddiy, maxfiy bo'lmagan fon ishlari uchun; Sozlamalarda yoqiladi. OPENROUTER_MODEL bilan almashtiriladi
    models:
      cheap:  {id: "meta-llama/llama-3.3-70b-instruct:free", in: 0, out: 0}
      mid:    {id: "meta-llama/llama-3.3-70b-instruct:free", in: 0, out: 0}
      strong: {id: "meta-llama/llama-3.3-70b-instruct:free", in: 0, out: 0}
  groq:   # BEPUL (limit bilan), juda tez. Faqat fon ishlari uchun, Sozlamalarda yoqiladi. GROQ_MODEL bilan almashtiriladi
    models:
      cheap:  {id: llama-3.1-8b-instant,    in: 0, out: 0}
      mid:    {id: llama-3.3-70b-versatile, in: 0, out: 0}
      strong: {id: llama-3.3-70b-versatile, in: 0, out: 0}
