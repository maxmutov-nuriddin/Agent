<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Jamoa</title>
<meta name="theme-color" content="#0a0c0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Jamoa">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="orb" id="orb"></span><div><h1>AI Jamoa</h1><p id="sub">Yuklanmoqda…</p></div></div>
    <div class="spend" id="spend"></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" id="sheet-bg"></div><div class="sheet-body" id="sheet-body"></div></div>
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form" autocomplete="off">
    <span class="orb big"></span>
    <h2>Kirish</h2>
    <p>Terminalda chiqqan maxfiy kalitni (WEB_TOKEN) kiriting yoki shu kalitli havolani oching.</p>
    <input id="token" type="password" placeholder="WEB_TOKEN" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn primary" id="login-btn" type="submit">Kirish</button>
    <p class="err" id="login-err"></p>
  </form>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
