<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Jamoa</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Jamoa">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<section id="chat" class="chatpage" hidden>
  <header class="chat-top">
    <button class="back" id="chat-back" aria-label="Orqaga">‹</button>
    <div class="grow"><h2>Rahbar</h2><p id="chat-sub"></p></div>
    <button class="btn lime" id="chat-task">+ Vazifa</button>
  </header>
  <div class="msgs" id="msgs"></div>
  <div class="composer">
    <textarea id="chat-input" rows="1" placeholder="Xabar yozing…" enterkeyhint="send"></textarea>
    <button class="mic" id="chat-mic" aria-label="Ovozli xabar"></button>
    <button class="send" id="chat-send" aria-label="Yuborish"></button>
  </div>
</section>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" id="sheet-bg"></div><div class="sheet-body" id="sheet-body"></div></div>
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form" autocomplete="off">
    <span class="ring big"></span>
    <h2>Kirish</h2>
    <p>Terminalda yoki Telegramda (/web) chiqqan havolani oching, yoki kalitni kiriting.</p>
    <input id="token" type="password" placeholder="WEB_TOKEN" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn lime" id="login-btn" type="submit">Kirish</button>
    <p class="err" id="login-err"></p>
  </form>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
